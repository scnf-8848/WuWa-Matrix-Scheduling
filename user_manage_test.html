<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 · 体验测试</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  nav {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    background: #1e1e1e;
    border-bottom: 1px solid #333;
  }
  nav button {
    margin: 0 10px;
    padding: 8px 16px;
    cursor: pointer;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 14px;
  }
  nav button:hover { background: #555; }

  .hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
    font-size: 14px;
    text-align: center;
  }

  /* ---------- 模态窗通用 ---------- */
  .overlay {
    position: fixed;
    width: 100vw;
    height: 100vh;
    top: 0;
    left: 0;
    background: rgba(0,0,0,.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .overlay.show { display: flex; }

  /* 用户管理窗：贴顶展示，避免满高窗口垂直居中挤压列表 */
  #userModal.show { align-items: flex-start; }
  #userModal.show .modal { margin-top: 16px; }
  .modal {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    max-height: 85vh;
  }
  .modal-title {
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ---------- 用户管理窗 ---------- */
  #userModal .modal { width: min(460px, 92vw); }
  #userList {
    padding: 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 70vh;
  }
  #userList::-webkit-scrollbar { width: 8px; }
  #userList::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  .user-card {
    background: #2a2a2a;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: border-color .2s, background .2s;
  }
  .user-card.active { border-color: #4ade80; background: #22331f; }

  .card-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .name-row { display: flex; align-items: center; gap: 5px; }
  .user-name { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .edit-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: #777;
    border-radius: 4px;
    width: 20px;
    height: 20px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .edit-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
  .name-input {
    background: #121212;
    border: 1px solid #555;
    color: #fff;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 14px;
    width: 130px;
  }
  .user-desc { font-size: 12px; color: #888; }

  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .card-actions button {
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    color: #fff;
    font-size: 12px;
  }
  .btn-import  { background: #2563eb; }
  .btn-import:hover  { background: #1d4fd8; }
  .btn-export  { background: #ca8a04; }
  .btn-export:hover  { background: #a97707; }
  .btn-delete  { background: #dc2626; }
  .btn-delete:hover  { background: #b91c1c; }

  /* 添加用户 */
  .add-user {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    color: #888;
    transition: border-color .2s, color .2s;
  }
  .add-user:hover { border-color: #4ade80; color: #4ade80; }
  .add-user button {
    background: none;
    border: none;
    color: inherit;
    font-size: 15px;
    cursor: pointer;
  }

  /* ---------- 小窗：导出 / 导入 / 确认 ---------- */
  .small-modal { width: min(420px, 92vw); }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .code-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .code-label { flex-shrink: 0; font-size: 13px; color: #ddd; white-space: nowrap; }
  .code-value {
    flex: 1 1 auto;
    min-width: 0;
    word-break: break-all;
    background: #121212;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    color: #ddd;
  }
  .copy-btn {
    flex-shrink: 0;
    width: 56px;
    padding: 4px 0;
    text-align: center;
    background: #374151;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .copy-btn:hover { background: #4b5563; }

  .import-input {
    width: 100%;
    background: #121212;
    border: 1px solid #555;
    color: #fff;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
  }
  .modal-btn-row { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-btn {
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    font-size: 13px;
    color: #fff;
  }
  .btn-primary { background: #2563eb; }
  .btn-primary:hover { background: #1d4fd8; }
  .btn-danger  { background: #dc2626; }
  .btn-danger:hover  { background: #b91c1c; }
  .btn-ghost   { background: #374151; }
  .btn-ghost:hover  { background: #4b5563; }

  .msg { font-size: 13px; }
  .msg.err { color: #f87171; }
  .msg.ok  { color: #4ade80; }

  .close-x {
    background: none;
    border: none;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .close-x:hover { color: #fff; }
</style>
</head>
<body>
  <nav>
    <button id="openUserBtn">用户管理</button>
  </nav>

  <!-- 用户管理窗口 -->
  <div id="userModal" class="overlay">
    <div class="modal">
      <div class="modal-title">
        <span>用户管理</span>
        <button class="close-x" data-close>×</button>
      </div>
      <div id="userList"></div>
    </div>
  </div>

  <!-- 导出小窗 -->
  <div id="exportModal" class="overlay">
    <div class="modal small-modal">
      <div class="modal-title">
        <span>导出</span>
        <button class="close-x" data-close>×</button>
      </div>
      <div class="modal-body">
        <div class="code-row"><span class="code-label">状态码：</span><span class="code-value" id="exportCodeLine"></span><button class="copy-btn" data-copy="exportCodeLine">复制</button></div>
        <div class="code-row"><span class="code-label">含状态码连接：</span><span class="code-value" id="exportUrlLine"></span><button class="copy-btn" data-copy="exportUrlLine">复制</button></div>
      </div>
    </div>
  </div>

  <!-- 导入小窗 -->
  <div id="importModal" class="overlay">
    <div class="modal small-modal">
      <div class="modal-title">
        <span>导入</span>
        <button class="close-x" data-close>×</button>
      </div>
      <div class="modal-body">
        <input id="importInput" class="import-input" placeholder="输入状态码，或含状态码的完整链接">
        <div class="modal-btn-row">
          <button class="modal-btn btn-primary" id="importOk">确定</button>
          <button class="modal-btn btn-ghost" data-close>取消</button>
        </div>
        <div id="importMsg" class="msg"></div>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div id="deleteModal" class="overlay">
    <div class="modal small-modal">
      <div class="modal-title"><span>删除用户</span></div>
      <div class="modal-body">
        <div class="msg">确定要删除用户“<span id="deleteName"></span>”吗？此操作不可恢复。</div>
        <div class="modal-btn-row">
          <button class="modal-btn btn-danger" id="deleteOk">删除</button>
          <button class="modal-btn btn-ghost" data-close>取消</button>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---------- 数据（仅演示内存态） ----------
  let uidSeq = 0;                 // 全局单调递增，删除不复用
  let currentUid = null;
  const users = [];               // { uid, name, charData:{}, teams:[] }

  function createUser(name, charCount) {
    uidSeq += 1;
    const u = {
      uid: uidSeq,
      name,
      charCount: (charCount !== undefined) ? charCount : randomCharCount(),
      teams: []
    };
    users.push(u);
    return u;
  }

  function randomCharCount() { return 1 + Math.floor(Math.random() * 57); }

  // 初始：空列表，不含任何用户
  // ---------- 模态开关 ----------
  function show(sel) {
    const m = document.getElementById(sel);
    m.classList.add('show');
  }
  function hideOverlays() {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
  }

  // ---------- 用户列表渲染 ----------
  function renderUserList() {
    const list = document.getElementById('userList');
    list.innerHTML = '';

    users.forEach(u => {
      const card = document.createElement('div');
      card.className = 'user-card' + (u.uid === currentUid ? ' active' : '');
      card.dataset.uid = u.uid;

      // 左：名字 + 简述
      const left = document.createElement('div');
      left.className = 'card-left';

      const nameRow = document.createElement('div');
      nameRow.className = 'name-row';
      const nameSpan = document.createElement('span');
      nameSpan.className = 'user-name';
      nameSpan.textContent = u.name;
      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startRename(card, u);
      });
      nameRow.appendChild(nameSpan);
      nameRow.appendChild(editBtn);

      const desc = document.createElement('div');
      desc.className = 'user-desc';
      desc.textContent = `持有 ${u.charCount} 个角色`;

      left.appendChild(nameRow);
      left.appendChild(desc);

      // 右：导入/导出/删除
      const actions = document.createElement('div');
      actions.className = 'card-actions';
      const imp = mkBtn('导入', 'btn-import', () => openImport(u));
      const exp = mkBtn('导出', 'btn-export', () => openExport(u));
      const del = mkBtn('删除', 'btn-delete', () => openDelete(u));
      actions.append(imp, exp, del);

      card.appendChild(left);
      card.appendChild(actions);
      // 点击卡片主体（避开右侧按钮与编辑图标）激活该用户
      card.addEventListener('click', () => {
        if (currentUid !== u.uid) {
          currentUid = u.uid;
          renderUserList();
        }
      });
      list.appendChild(card);
    });

    // 添加用户虚线框
    const add = document.createElement('div');
    add.className = 'add-user';
    const addBtn = document.createElement('button');
    addBtn.textContent = '＋ 添加用户';
    addBtn.addEventListener('click', () => addNewUser());
    add.appendChild(addBtn);
    list.appendChild(add);
  }

  function mkBtn(text, cls, handler) {
    const b = document.createElement('button');
    b.className = cls;
    b.textContent = text;
    b.addEventListener('click', (e) => { e.stopPropagation(); handler(); });
    return b;
  }

  // ---------- 编辑名字 ----------
  function startRename(card, u) {
    const nameSpan = card.querySelector('.user-name');
    const editBtn = card.querySelector('.edit-btn');
    const input = document.createElement('input');
    input.className = 'name-input';
    input.value = u.name;

    const finish = (save) => {
      if (save && input.value.trim()) u.name = input.value.trim();
      renderUserList();
    };
    editBtn.replaceWith(input);
    nameSpan.replaceWith(input);
    input.focus();
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { u.name = undefined; input.value = ''; finish(false); }
    });
  }

  // ---------- 导出（随机生成状态码） ----------
  function openExport(u) {
    const code = randomCode();
    document.getElementById('exportCodeLine').textContent = code;
    document.getElementById('exportUrlLine').textContent = 'https://wuwamatrix.pages.dev/import#' + code;
    document.getElementById('exportModal').dataset.code = code;
    show('exportModal');
  }

  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  function randomCode() {
    const n = 57; // 已实装角色数
    let s = '';
    for (let i = 0; i < n + 2; i++) s += B64[Math.floor(Math.random() * B64.length)];
    return s;
  }

  // ---------- 复制 ----------
  async function copyToClipboard(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => btn.textContent = old, 1200);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      const old = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => btn.textContent = old, 1200);
    }
  }

  // ---------- 导入（接受任意输入） ----------
  let importTarget = null;
  function openImport(u) {
    importTarget = u;
    document.getElementById('importMsg').textContent = '';
    document.getElementById('importMsg').className = 'msg';
    document.getElementById('importInput').value = '';
    show('importModal');
    setTimeout(() => document.getElementById('importInput').focus(), 0);
  }
  document.getElementById('importOk').addEventListener('click', () => {
    const val = document.getElementById('importInput').value.trim();
    const msg = document.getElementById('importMsg');
    if (!val) {
      msg.textContent = '请输入状态码或链接';
      msg.className = 'msg err';
      return;
    }
    if (!importTarget) return;
    // 演示：任意输入都可导入，仅演示更新角色数与关闭弹窗
    importTarget.charCount = randomCharCount();
    msg.textContent = `已导入到“${importTarget.name}”`;
    msg.className = 'msg ok';
    renderUserList();
    setTimeout(() => document.getElementById('importModal').classList.remove('show'), 900);
  });
  document.getElementById('importInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('importOk').click();
  });

  // ---------- 删除（二次确认） ----------
  let deleteTarget = null;
  function openDelete(u) {
    deleteTarget = u;
    document.getElementById('deleteName').textContent = u.name;
    document.getElementById('deleteModal').dataset.uid = u.uid;
    show('deleteModal');
  }
  document.getElementById('deleteOk').addEventListener('click', () => {
    if (!deleteTarget) return;
    const idx = users.indexOf(deleteTarget);
    if (idx >= 0) users.splice(idx, 1);
    // 删除当前激活：回落剩余用户，无则 null
    if (currentUid === deleteTarget.uid) {
      currentUid = users.length ? users[0].uid : null;
    }
    deleteTarget = null;
    document.getElementById('deleteModal').classList.remove('show');
    renderUserList();
  });

  // ---------- 添加用户（自动设为当前激活） ----------
  function addNewUser() {
    const seq = uidSeq + 1;
    const u = createUser(`用户${seq}`);
    currentUid = u.uid;
    renderUserList();
  }

  // ---------- 事件绑定 ----------
  document.getElementById('openUserBtn').addEventListener('click', () => {
    renderUserList();
    show('userModal');
  });

  // data-close 按钮：仅关闭自身所在弹窗（保留父级“用户管理”窗口）
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.overlay').classList.remove('show');
    });
  });

  // 复制按钮
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.copy;
      const line = document.getElementById(id);
      const text = line.textContent.trim();
      copyToClipboard(text, btn);
    });
  });

  // 点击遮罩空白处关闭
  document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('mousedown', (e) => {
      if (e.target === o) o.classList.remove('show');
    });
  });

  // 初始化：空态（无用户）
  renderUserList();
</script>
</body>
</html>

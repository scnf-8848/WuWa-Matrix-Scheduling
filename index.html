<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鸣潮矩阵编队
    </title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>
    <nav>
        <div class="nav-left">
            <div class="toggle-container">
                <label class="toggle-label">显示链+武</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="attrToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <div class="nav-center">
            <button id="roleBtn">1-角色</button>
            <button id="teamBtn">2-配队</button>
        </div>
        <div class="nav-right">
            <button id="userMgrBtn">用户管理</button>
            <button id="clearBtn" class="clear-all-btn">清空数据</button>
        </div>
    </nav>
    <div id="rolePage" class="page">
        <div class="left-panel">
            <div id="roleList" class="role-list"></div>
            <div id="leftStatusBar" class="left-status-bar">
                <span class="left-status-label">分享码：</span>
                <span class="left-status-code" id="leftStatusCode"></span>
                <button class="copy-btn" data-copy="leftStatusCode">复制</button>
                <button class="copy-btn" id="leftStatusImport">导入</button>
            </div>
        </div>
        <div class="right-panel">
            <div id="roleDetail" class="role-detail">
                <p>请选择一个角色查看详情</p>
            </div>
        </div>
    </div>
    <div id="teamPage" class="page hidden">
        <div class="left-panel">
            <div class="role-list-container">
                <div id="teamRoleList" class="role-list"></div>
            </div>
        </div>
        <div class="right-panel">
            <div id="teamSection" class="team-section">
                <!-- 队伍将在这里动态生成 -->
            </div>
            <div class="team-footer">
            </div>
        </div>
    </div>

    <!-- 用户管理窗口 -->
    <div id="userModal" class="overlay">
        <div class="modal">
            <div class="modal-title">
                <span>用户管理</span>
                <button class="close-x" data-close>×</button>
            </div>
            <div id="userList" class="um-user-list"></div>
        </div>
    </div>

    <!-- 导出小窗 -->
    <div id="exportModal" class="overlay">
        <div class="modal small-modal">
            <div class="modal-title">
                <span>导出</span>
                <button class="close-x" data-close>×</button>
            </div>
            <div class="modal-body">
                <div class="msg hint">仅角色数据，不含编队方案</div>
                <div class="code-row"><span class="code-label">分享码：</span><span class="code-value" id="exportCodeLine"></span><button class="copy-btn" data-copy="exportCodeLine">复制</button></div>
                <div class="code-row"><span class="code-label">链接：</span><span class="code-value" id="exportUrlLine"></span><button class="copy-btn" data-copy="exportUrlLine">复制</button></div>
            </div>
        </div>
    </div>

    <!-- 导入小窗 -->
    <div id="importModal" class="overlay">
        <div class="modal small-modal">
            <div class="modal-title">
                <span>导入</span>
                <button class="close-x" data-close>×</button>
            </div>
            <div class="modal-body">
                <div class="msg hint">仅角色数据，不含编队方案</div>
                <input id="importInput" class="import-input" placeholder="输入分享码，或含分享码的完整链接">
                <div class="modal-btn-row">
                    <button class="modal-btn btn-primary" id="importOk">确定</button>
                </div>
                <div id="importMsg" class="msg"></div>
            </div>
        </div>
    </div>

    <!-- 删除确认 -->
    <div id="deleteModal" class="overlay">
        <div class="modal small-modal">
            <div class="modal-title"><span>删除用户</span></div>
            <div class="modal-body">
                <div class="msg">确定要删除用户“<span id="deleteName"></span>”吗？此操作不可恢复。</div>
                <div class="modal-btn-row">
                    <button class="modal-btn btn-danger" id="deleteOk">删除</button>
                    <button class="modal-btn btn-ghost" data-close>取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 清空数据确认 -->
    <div id="clearModal" class="overlay">
        <div class="modal small-modal">
            <div class="modal-title"><span>清空数据</span></div>
            <div class="modal-body">
                <div class="msg">确定要清空<b>所有用户</b>的数据吗？此操作将清除全部用户及其角色、队伍数据，且<strong>无法恢复</strong>。</div>
                <div class="modal-btn-row">
                    <button class="modal-btn btn-danger" id="clearOk">清空</button>
                    <button class="modal-btn btn-ghost" data-close>取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="characters.js"></script>
    <script src="script.js"></script>
</body>
</html>
